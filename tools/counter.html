<script>/* recuento de visitas sin cookies ni datos personales (GoatCounter); ?ref=ig, ?ref=wa… dicen de dónde llega la visita */
(function(){try{if(!/(^|\.)dextrasinistra\.com$/.test(location.hostname))return;if(matchMedia("(display-mode: standalone)").matches)return;
var q=new URLSearchParams(location.search),r=q.get("ref")||document.referrer||"";
var i=new Image();i.src="https://dextrasinistra.goatcounter.com/count?p="+encodeURIComponent(location.pathname)+"&t="+encodeURIComponent(document.title)+"&r="+encodeURIComponent(r)+"&rnd="+Math.random().toString(36).slice(2);}catch(e){}})();</script>
